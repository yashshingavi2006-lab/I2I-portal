name: Keep-alive and notification processor

on:
  schedule:
    # Every 15 minutes — keeps Supabase Free tier from auto-pausing (pauses
    # after 7 days of zero activity) and gives near-real-time notification
    # delivery without paying for Vercel Cron.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # allows manually triggering from the Actions tab

jobs:
  ping-and-process:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app (keeps Supabase project active)
        run: curl -sf "${{ secrets.SITE_URL }}/api/health" || true

      - name: Process pending notifications
        run: |
          curl -sf -X POST "${{ secrets.SITE_URL }}/api/notifications/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || true
